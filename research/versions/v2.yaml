# Macro series registry v2 (architecture §9.1, §26 Phase 4; ECON-003/ECON-004
# fixes, docs/decisions/0014's macro-economist review).
#
# v1's five series are carried over byte-identical (never edit a shipped
# version's existing mappings in place once any macro_observations row
# references it — §2.4, §28 rule 9); this version only adds new series.
# Read by app.domain.macro_series — do not rename keys without updating that
# module. See versions/v1.yaml for the general shape/routing explanation.
#
# New in v2:
#   - ECON-003: two FRED-hosted crude oil benchmarks, addressing the "no
#     commodity price series despite a commodity-heavy portfolio" gap (Vår
#     Energi oil & gas exposure, plus the gold mining ETF/physical metals
#     already covered on the market-data side by Phase 8's gold-api.com
#     integration — this registry is macro *context*, not holding pricing,
#     so it doesn't duplicate that). Both series IDs confirmed live on FRED
#     (fred.stlouisfed.org/series/DCOILWTICO, /DCOILBRENTEU) via web search
#     this session — this build environment has no live FRED_API_KEY network
#     path to smoke-test the actual API call (see decision 0007's
#     Consequences; unchanged this pass), but the series identifiers
#     themselves are not in question the way Norges Bank's were.
#   - ECON-004: an ECB policy rate and Eurozone HICP inflation series, plus a
#     China CPI series, addressing "no Eurozone/China macro coverage even
#     though the research prompt explicitly asks the LLM about the ECB."
#     Same FRED-confirmed-by-search caveat as above.
#
# To change a series without losing the ability to reproduce past runs
# (§2.4, §28 rule 9), add a new versions/v3.yaml and point
# settings.active_macro_series_version at it — never edit this version's
# mappings in place once any macro_observations row references it.
version: v2
description: >
  v1's five US/Norway series (policy rate, headline inflation, 10y real
  yield, 10y breakeven, dollar index; Norway policy rate) plus ECON-003's
  two commodity benchmarks and ECON-004's Eurozone/China coverage.
series:
  us_policy_rate:
    provider: fred
    provider_series_id: DFF
    fred_units: lin
    description: Effective Federal Funds Rate (daily), as a US policy-rate proxy.
    unit: percent
    region: US
  us_headline_cpi_yoy:
    provider: fred
    provider_series_id: CPIAUCSL
    fred_units: pc1
    description: >
      CPI for All Urban Consumers, requested as FRED's own "percent change
      from year ago" (units=pc1) transform — headline YoY inflation.
    unit: percent
    region: US
  us_real_yield_10y:
    provider: fred
    provider_series_id: DFII10
    fred_units: lin
    description: 10-Year Treasury Inflation-Indexed Security, constant maturity — the real yield.
    unit: percent
    region: US
  us_breakeven_10y:
    provider: fred
    provider_series_id: T10YIE
    fred_units: lin
    description: 10-Year Breakeven Inflation Rate.
    unit: percent
    region: US
  us_dollar_index_broad:
    provider: fred
    provider_series_id: DTWEXBGS
    fred_units: lin
    description: >
      Trade Weighted U.S. Dollar Index, Broad, Goods and Services — a free
      FRED-hosted proxy for broad dollar strength (the proprietary ICE DXY
      index itself isn't on FRED).
    unit: index
    region: US
  no_policy_rate:
    provider: norges_bank
    dataset: IR
    key: "B.KPRA.SD."
    description: >
      Norway's key policy rate (sight deposit rate). CAUTION: this build
      environment has no verified live access to the Norges Bank API (see
      docs/decisions/0007's Consequences) — the dataset/key above is a
      best-effort reading of Norges Bank's published API guide, not a value
      confirmed against a real response. Verify it against
      https://data.norges-bank.no/api/data/IR/ before relying on this series;
      it is a one-line config fix here if the code needs to change.
    unit: percent
    # Quoted deliberately: YAML 1.1's default resolver parses an unquoted
    # `NO` as the boolean `false` (the classic "Norway problem"), which
    # PyYAML's safe_load reproduces — confirmed directly in this sandbox.
    region: "NO"
  commodity_oil_wti:
    provider: fred
    provider_series_id: DCOILWTICO
    fred_units: lin
    description: >
      Crude Oil Prices: West Texas Intermediate (WTI) - Cushing, Oklahoma
      (daily) — the global benchmark most sector/macro commentary quotes.
    unit: USD/barrel
    region: GLOBAL
  commodity_oil_brent:
    provider: fred
    provider_series_id: DCOILBRENTEU
    fred_units: lin
    description: >
      Crude Oil Prices: Brent - Europe (daily) — the North Sea benchmark
      Vår Energi's own production is priced against, more directly relevant
      to that holding than WTI alone.
    unit: USD/barrel
    region: GLOBAL
  eurozone_policy_rate:
    provider: fred
    provider_series_id: ECBDFR
    fred_units: lin
    description: ECB Deposit Facility Rate for the Euro Area — the ECB's operative policy rate.
    unit: percent
    region: EA
  eurozone_hicp_yoy:
    provider: fred
    provider_series_id: CP0000EZ19M086NEST
    fred_units: pc1
    description: >
      Harmonized Index of Consumer Prices, All-Items, Euro Area (19
      countries), requested as FRED's "percent change from year ago"
      (units=pc1) transform — headline YoY Eurozone inflation.
    unit: percent
    region: EA
  china_cpi_yoy:
    provider: fred
    provider_series_id: CHNCPIALLMINMEI
    fred_units: pc1
    description: >
      Consumer Price Index: Total for China (OECD MEI series, as hosted on
      FRED), requested as FRED's "percent change from year ago" (units=pc1)
      transform — headline YoY China inflation.
    unit: percent
    region: CN
