[tool.ruff]
# Ruff is pinned in requirements-dev.txt (CI and pre-commit use the same
# version, so a new ruff release can't start failing CI on its own).
# Migrations are frozen history: never reformatted after they've run.
extend-exclude = ["alembic/versions"]

# Ruff project config. Without this file ruff falls back to its own
# (very broad) defaults, which include flake8-bugbear's B008 — a rule
# that flags `Depends(...)`/`Form(...)`/`File(...)` as "function calls in
# argument defaults". That's FastAPI's own required idiom for declaring
# dependencies and request parts (see app/api/documents.py), not a bug, so
# it's allowlisted here rather than suppressed per-line with `# noqa`.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
]

# mypy is a report-only CI job for now (about 170 old findings, none gating): it prints the list and a count so
# the number can only be seen to fall. Make it blocking once it reaches zero (docs/ops/mypy-report-only-2026-10-14.md).
[tool.mypy]
python_version = "3.12"
files = ["app"]
exclude = ["alembic/"]
warn_unused_configs = true
show_error_codes = true
pretty = false

# yfinance ships no type information and has no stubs package.
[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

