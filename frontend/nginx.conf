# Templated by the nginx:alpine base image's docker-entrypoint.d envsubst
# step (nginx/templates/*.template -> nginx/conf.d/*.conf) — ${PORT} comes
# from the container environment (see Dockerfile).
#
# gzip + long-lived caching added 2026-09-28 (page-load-performance
# investigation, claude/page-load-performance-investigation-2026-09-28.md):
# this config previously shipped the built JS/CSS bundle uncompressed and
# with no cache headers on every single visit.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json
        application/xml application/xml+rss image/svg+xml font/woff2;

    # Vite's dist/assets/ filenames are content-hashed (e.g.
    # index-abc123.js) — safe to cache forever; a real change ships under a
    # new filename, not a mutated one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — client-side routing owns every unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
