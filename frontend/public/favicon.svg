<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -4 104 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.28" stop-color="#f6c744"/>
      <stop offset="0.62" stop-color="#d8962a"/>
      <stop offset="1" stop-color="#8a5412"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5412"/>
      <stop offset="0.25" stop-color="#f2bd3c"/>
      <stop offset="0.45" stop-color="#fff0a0"/>
      <stop offset="0.7" stop-color="#e0a232"/>
      <stop offset="1" stop-color="#7a4610"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f7fe0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8fe0ff" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="ruby" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffb3b3"/>
      <stop offset="0.35" stop-color="#e0243a"/>
      <stop offset="1" stop-color="#6a0a1c"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c8fff4"/>
      <stop offset="0.4" stop-color="#18c0b0"/>
      <stop offset="1" stop-color="#075a68"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- warm glow behind the lamp -->
  <ellipse cx="52" cy="62" rx="46" ry="30" fill="url(#glow)"/>

  <!-- genie smoke rising from the spout -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 38 C-3 30 17 28 11 18 C5 9 22 9 20 3" stroke="#2f7fe0" stroke-opacity="0.35" stroke-width="12"/>
    <path d="M9 38 C-3 30 17 28 11 18 C5 9 22 9 20 3" stroke="url(#smoke)" stroke-width="7.5"/>
    <path d="M9 38 C-3 30 17 28 11 18 C5 9 22 9 20 3" stroke="#e6f9ff" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M20 3 C27 -2 35 4 30 10 C26 14 21 10 25 7" stroke="#8fe0ff" stroke-opacity="0.9" stroke-width="3.2"/>
  </g>

  <!-- spout -->
  <path d="M20 66 C8 64 3 50 3 37 L12 36 C14 47 22 53 32 55 Z" fill="url(#goldH)" stroke="#6a3c0a" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="7.5" cy="36" rx="6" ry="2.6" transform="rotate(-8 7.5 36)" fill="url(#gold)" stroke="#6a3c0a" stroke-width="1.2"/>
  <ellipse cx="7.5" cy="35.6" rx="3.6" ry="1.2" transform="rotate(-8 7.5 36)" fill="#4a2606"/>

  <!-- handle -->
  <path d="M81 58 C98 60 100 40 89 34 C84 31 79 36 84 39" fill="none" stroke="#6a3c0a" stroke-width="6.4" stroke-linecap="round"/>
  <path d="M81 58 C98 60 100 40 89 34 C84 31 79 36 84 39" fill="none" stroke="url(#gold)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M86 40 C93 44 92 54 82 56" fill="none" stroke="#fff6c0" stroke-opacity="0.55" stroke-width="1" stroke-linecap="round"/>

  <!-- foot -->
  <path d="M36 88 h28 l-3 -8 h-22 z" fill="url(#goldH)" stroke="#6a3c0a" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M42 80 h16 v-5 h-16 z" fill="url(#goldH)" stroke="#6a3c0a" stroke-width="1"/>

  <!-- belly -->
  <path d="M15 54 C15 73 31 82 50 82 C69 82 85 73 85 54 Z" fill="url(#goldH)" stroke="#6a3c0a" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M15 54 C15 73 31 82 50 82 C69 82 85 73 85 54 Z" fill="url(#gold)" opacity="0.5"/>
  <!-- filigree band -->
  <path d="M22 60 C32 71 68 71 78 60" fill="none" stroke="#7a4610" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M26 56.5 C36 66 64 66 74 56.5" fill="none" stroke="#fff3b0" stroke-opacity="0.7" stroke-width="1" stroke-linecap="round"/>
  <!-- gems -->
  <circle cx="50" cy="69" r="5.2" fill="url(#ruby)" stroke="#7a4610" stroke-width="1.2"/>
  <circle cx="48.4" cy="67.2" r="1.3" fill="#fff" opacity="0.85"/>
  <circle cx="35" cy="66" r="2.8" fill="url(#teal)" stroke="#7a4610" stroke-width="0.9"/>
  <circle cx="65" cy="66" r="2.8" fill="url(#teal)" stroke="#7a4610" stroke-width="0.9"/>
  <!-- belly highlight -->
  <path d="M21 58 C22 68 30 75 40 78" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/>

  <!-- rim -->
  <ellipse cx="50" cy="54" rx="35" ry="6.5" fill="url(#goldH)" stroke="#6a3c0a" stroke-width="1.4"/>
  <ellipse cx="50" cy="53.2" rx="31" ry="4.2" fill="#8a5412" opacity="0.55"/>

  <!-- lid -->
  <path d="M29 53 C29 42 37 37 50 37 C63 37 71 42 71 53 C62 56 38 56 29 53 Z" fill="url(#goldH)" stroke="#6a3c0a" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M34 47 C38 41 44 40 50 40" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
  <!-- finial -->
  <path d="M45.5 39 C44 31 52 30 49.5 20 C58 25 57 33 54.5 39 Z" fill="url(#gold)" stroke="#6a3c0a" stroke-width="1.2" stroke-linejoin="round"/>
  <circle cx="50" cy="19.5" r="2.2" fill="url(#ruby)" stroke="#6a3c0a" stroke-width="0.8"/>

  <!-- sparkles -->
  <g fill="#fffbe0">
    <path d="M31 15 l1.6 5 l5 1.6 l-5 1.6 l-1.6 5 l-1.6 -5 l-5 -1.6 l5 -1.6 Z"/>
    <path d="M84 16 l1.2 3.6 l3.6 1.2 l-3.6 1.2 l-1.2 3.6 l-1.2 -3.6 l-3.6 -1.2 l3.6 -1.2 Z"/>
    <path d="M70 8 l0.9 2.6 l2.6 0.9 l-2.6 0.9 l-0.9 2.6 l-0.9 -2.6 l-2.6 -0.9 l2.6 -0.9 Z"/>
  </g>
</svg>
