# Scenario version v1 (architecture §18, §26 Phase 5).
#
# Read by app.domain.scenarios — do not rename keys without updating that
# module. Shocks are illustrative, directionally-reasoned percentage moves
# (or basis points for `context.rates_bp`, informational only — see that
# module's docstring for what's mechanically applied vs. shown as context),
# not the output of any quantitative factor model — the same caveat the
# architecture doc's own §18 example carries. Revisit/replace with better-
# grounded numbers once there's real interest in relying on this for more
# than a directional "what happens to my portfolio" estimate.
#
# `shocks.asset_class` keys must be canonical AssetClass values
# (app.domain.asset_class) — EQUITY/ETF/FUND/CASH/BOND/OTHER.
# `shocks.sector` keys are matched case-insensitively as a substring of
# each holding's free-text sector, so keep them lowercase and specific
# enough not to over-match. `shocks.currency` keys are ISO currency codes.
#
# To change these numbers without losing the ability to reproduce a past
# scenario_json, add scenarios/versions/v2.yaml and point
# settings.active_scenario_version at it — never edit this file's numbers
# in place once any portfolio_risk_snapshots row references it (§2.4).
version: v1
description: >
  Initial Phase 5 macro/stress scenario registry — the eight illustrative
  scenarios named in architecture §18.

scenarios:
  recession:
    label: Recession
    description: Broad economic contraction; flight to quality.
    context:
      rates_bp: -150
      oil_pct: -30
    shocks:
      asset_class:
        EQUITY: -25
        ETF: -22
        FUND: -18
        BOND: 5
        CASH: 0
      sector:
        energy: -30
        financials: -20
      currency:
        USD: 3

  stagflation:
    label: Stagflation Resurgence
    description: Sticky inflation alongside weak growth; real yields rise.
    context:
      rates_bp: 150
      oil_pct: 20
      inflation_pct: 4
    shocks:
      asset_class:
        EQUITY: -15
        ETF: -13
        FUND: -10
        BOND: -10
        CASH: -3
      sector:
        gold: 20
        energy: 15
        "precious metals": 20
      currency:
        USD: 5
        NOK: -3

  disinflation:
    label: Disinflation
    description: Inflation falls back toward target without a growth shock.
    context:
      rates_bp: -75
    shocks:
      asset_class:
        EQUITY: 8
        ETF: 7
        FUND: 6
        BOND: 6
      sector:
        technology: 12
      currency: {}

  deflation:
    label: Deflation
    description: Broad price-level decline; demand collapse.
    context:
      rates_bp: -200
      oil_pct: -40
    shocks:
      asset_class:
        EQUITY: -30
        ETF: -27
        FUND: -22
        BOND: 12
        CASH: 2
      sector:
        energy: -35
        gold: -10
        materials: -25
      currency:
        USD: 6

  commodity_shock:
    label: Commodity Supply Shock
    description: Sharp commodity-price spike from a supply disruption.
    context:
      oil_pct: 25
    shocks:
      asset_class:
        EQUITY: -8
        ETF: -6
        FUND: -5
      sector:
        energy: 25
        gold: 10
        materials: 15
        "consumer discretionary": -10
      currency:
        NOK: 4

  interest_rate_shock:
    label: Interest-Rate Shock
    description: Sharp, unexpected policy-rate increase.
    context:
      rates_bp: 200
    shocks:
      asset_class:
        BOND: -10
        EQUITY: -12
        ETF: -10
        FUND: -8
      sector:
        "real estate": -18
        technology: -15
        financials: 5
      currency:
        USD: 4

  geopolitical_escalation:
    label: Geopolitical Escalation
    description: Major geopolitical conflict or crisis event.
    context:
      oil_pct: 12
    shocks:
      asset_class:
        EQUITY: -12
        ETF: -10
        FUND: -8
      sector:
        gold: 15
        defense: 12
        energy: 10
        travel: -15
      currency:
        USD: 4

  liquidity_crisis:
    label: Liquidity Crisis
    description: Forced deleveraging/selling across asset classes; credit spreads widen.
    context:
      rates_bp: 50
    shocks:
      asset_class:
        EQUITY: -20
        ETF: -20
        FUND: -22
        BOND: -8
        CASH: 1
      sector:
        gold: -5
        financials: -25
      currency:
        USD: 8
