# Scoring version v1 (architecture §13.2, §26 Phase 3).
#
# Read by app.domain.scoring — do not rename keys without updating that
# module. A holding's overall_score is a weighted average of its three
# LLM-scored factors (each 1-10). Portfolio-level risk (concentration, HHI —
# Phase 2, app.domain.calculations) is a separate dimension per architecture
# §14 and is never blended in here.
#
# To change weighting without losing the ability to reproduce past runs
# (§2.4, §28 rule 9), add a new versions/v2.yaml and point
# settings.active_scoring_version at it — never edit an existing version's
# weights in place once any analysis_runs row references it.
version: v1
description: >
  Initial Phase 3 scoring — simple weighted average of the three LLM-assigned
  qualitative factor scores (business_quality, financial_strength, valuation).
factor_weights:
  business_quality: 0.40
  financial_strength: 0.30
  valuation: 0.30
confidence_aggregation: minimum
