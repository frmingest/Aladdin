# Scoring version v2 (architecture §13.1/§13.2, ECON-002 fix,
# docs/decisions/0014-macro-economic-review.md).
#
# Read by app.domain.scoring — do not rename keys without updating that
# module. Adds regime-conditional factor-weight profiles on top of v1's
# single fixed 40/30/30 blend, per architecture §13.1: "Fixed weights
# implicitly assume macro/geopolitical factors matter the same amount in
# every environment... define a small set of named weight profiles (e.g.
# baseline, stagflation, crisis)... with a macro_regime field on the
# analysis run." That design was approved in the v3.0 architecture revision
# but never implemented until this version — ECON-002 flagged it as
# already-approved scope, not a new design question.
#
# `baseline` reproduces v1's weights exactly, so a run classified as
# baseline is unchanged from v1's behavior. `stagflation`/`crisis` shift
# relative weight toward `valuation` (higher discount rates compress
# long-duration cash-flow value more than they change business quality —
# ADR 0014) and, for `crisis`, also toward `financial_strength` (balance-
# sheet resilience matters more when credit conditions are tight).
#
# `regime_classification` is read by app.domain.scoring.classify_macro_regime
# against the latest us_real_yield_10y/us_headline_cpi_yoy macro
# observations (research/versions/v1.yaml, app.services.research.macro) —
# deliberately conservative thresholds reusing series already in the
# registry rather than adding a new volatility/crisis-specific indicator
# this pass (see ADR 0014's Consequences). "stagflation" is high inflation
# with a real yield not compensating for it; "crisis" is a materially
# negative real yield — a sharper version of the same signal. Checked in
# that order (crisis first) so a reading that qualifies for both is
# classified as the more severe one.
#
# To change a weight profile or a classification threshold without losing
# the ability to reproduce a past analysis run (AnalysisRun.macro_regime +
# .scoring_version together record exactly what produced it), add
# scoring/versions/v3.yaml and point settings.active_scoring_version at it —
# never edit this file's numbers in place once any analysis_runs row
# references it (§2.4).
version: v2
description: >
  Regime-conditional factor weights (ECON-002 fix). baseline reproduces v1's
  40/30/30 blend; stagflation and crisis shift weight toward valuation (and,
  for crisis, financial_strength) when us_real_yield_10y/us_headline_cpi_yoy
  indicate a higher-discount-rate or more distressed macro environment.
confidence_aggregation: minimum

factor_weight_profiles:
  baseline:
    business_quality: 0.40
    financial_strength: 0.30
    valuation: 0.30
  stagflation:
    business_quality: 0.30
    financial_strength: 0.30
    valuation: 0.40
  crisis:
    business_quality: 0.25
    financial_strength: 0.35
    valuation: 0.40

regime_classification:
  crisis:
    us_real_yield_10y_at_most: -1.0
  stagflation:
    us_headline_cpi_yoy_at_least: 4.0
    us_real_yield_10y_at_most: 1.0
