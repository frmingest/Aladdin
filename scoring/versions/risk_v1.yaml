# Risk scoring version risk_v1 (architecture §15, §26 Phase 5).
#
# Read by app.domain.portfolio_risk — do not rename keys without updating
# that module. Distinct version namespace from the holding-factor scoring
# in v1.yaml (that config drives HoldingAnalysis.overall_score; this one
# drives PortfolioRiskSnapshot.composite_risk_score/risk_band) — see
# docs/decisions/0008 for why they're separate files rather than one.
#
# `moderate_at`/`moderate_high_at`/`high_at` are the raw-metric breakpoints
# for that dimension's qualitative band (LOW / MODERATE / MODERATE-HIGH /
# HIGH). `severity_scale` is the raw value that maps to a 0-100 "severity"
# for the composite blend (capped at 100) — deliberately looser than the
# band breakpoints so the composite score doesn't saturate at exactly the
# HIGH threshold.
#
# To change thresholds/weights without losing the ability to reproduce a
# past risk snapshot, add scoring/versions/risk_v2.yaml and point
# settings.active_risk_scoring_version at it — never edit this file's
# numbers in place once any portfolio_risk_snapshots row references it
# (same discipline as v1.yaml, §2.4).
version: risk_v1
description: >
  Initial Phase 5 portfolio risk scoring — weighted blend of concentration,
  currency/commodity exposure, correlation, and systemic/state risk into a
  secondary composite score, with the headline risk_band taken from the
  single worst-scoring dimension (app.domain.portfolio_risk.worst_band).

dimension_weights:
  single_name_concentration: 0.25
  sector_concentration: 0.15
  currency_exposure: 0.15
  commodity_exposure: 0.10
  correlation: 0.15
  systemic_state_risk: 0.20

dimension_thresholds:
  single_name_concentration:  # single-name HHI, 0-10000 scale
    moderate_at: 1500
    moderate_high_at: 2500
    high_at: 4000
    severity_scale: 5000
  sector_concentration:  # sector HHI, 0-10000 scale
    moderate_at: 1500
    moderate_high_at: 2500
    high_at: 4000
    severity_scale: 5000
  currency_exposure:  # % of portfolio outside the reporting currency
    moderate_at: 20
    moderate_high_at: 50
    high_at: 75
    severity_scale: 100
  commodity_exposure:  # % of portfolio in commodity-sensitive sectors
    moderate_at: 10
    moderate_high_at: 25
    high_at: 40
    severity_scale: 100
  correlation:  # average pairwise |correlation| among priced holdings
    moderate_at: 0.3
    moderate_high_at: 0.6
    high_at: 0.8
    severity_scale: 1
  systemic_state_risk:  # % of cash/deposits above the per-institution guarantee limit
    moderate_at: 0
    moderate_high_at: 25
    high_at: 60
    severity_scale: 100

# Fallback only (app.domain.portfolio_risk.derive_risk_band) — the headline
# risk_band prefers worst_band() over per-dimension bands. Minimum composite
# severity required to qualify for each band, checked from HIGH down.
band_severity_thresholds:
  HIGH: 75
  MODERATE-HIGH: 50
  MODERATE: 25
  LOW: 0
