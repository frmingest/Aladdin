# Post-deploy smoke test (Sprint 7, F4): read-only Playwright checks against
# the live Railway site. Needs two repository variables (Settings -> Secrets
# and variables -> Actions -> Variables):
#   SMOKE_FRONTEND_URL  e.g. https://aladdin-frontend.up.railway.app
#   SMOKE_API_URL       e.g. https://aladdin-backend.up.railway.app
# Optional repository secret, only needed once APP_AUTH_TOKEN is set in
# Railway (2026-09-27, see backend/app/security.py) -- unset, the smoke
# test's direct API calls send no header, same as before this existed:
#   SMOKE_API_KEY       must match the backend's APP_AUTH_TOKEN
# Runs after Railway reports a successful deployment to GitHub, every
# morning, and on demand (Actions -> Smoke test -> Run workflow).
name: Smoke test

on:
  workflow_dispatch:
  deployment_status:
  schedule:
    - cron: "30 5 * * *" # 07:30 Oslo summer time

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      SMOKE_FRONTEND_URL: ${{ vars.SMOKE_FRONTEND_URL }}
      SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
      SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
    steps:
      - name: Needs the two URLs
        if: env.SMOKE_FRONTEND_URL == '' || env.SMOKE_API_URL == ''
        # Runs before checkout, so `frontend/` does not exist yet: without this
        # the step crashed ("working directory ... No such file") instead of
        # printing the message below.
        working-directory: .
        run: |
          echo "::error::Set the repository variables SMOKE_FRONTEND_URL and SMOKE_API_URL."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the new deployment to answer
        # Railway reports success when the container starts; give migrations
        # and uvicorn a moment.
        run: |
          for i in $(seq 1 30); do
            curl -sf "$SMOKE_API_URL/health" && exit 0
            sleep 10
          done
          echo "::error::$SMOKE_API_URL/health did not answer in 5 minutes"
          exit 1
      - run: npm run smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report
          path: frontend/playwright-report
          retention-days: 14
