name: Work item
description: A feature, chore or decision that belongs on the sprint board
labels: ["backlog"]
body:
  - type: textarea
    id: why
    attributes:
      label: What and why
      description: Plain words. What should be true when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A short checklist a reviewer can tick off.
      placeholder: "- [ ] ..."
  - type: textarea
    id: links
    attributes:
      label: Related docs
      description: Paths under docs/ or earlier issues and PRs.
