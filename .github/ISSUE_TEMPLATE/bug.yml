name: Bug
description: Something is wrong or misleading
labels: ["bug", "backlog"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, where (page or place in /game3d), and what you expected.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to see it
