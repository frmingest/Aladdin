name: CI

# Third guardrail layer (see CLAUDE.md / docs/decisions/0015): runs the same
# checks as "before you consider a change done" and .pre-commit-config.yaml,
# but here regardless of whether local hooks/pre-commit were installed or
# skipped. This is what actually answers "is main green right now" — see
# the "status honesty" problem in CLAUDE.md this exists to fix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy app

      - name: pytest
        # No real DATABASE_URL/API keys here on purpose — the suite runs
        # against a temp SQLite DB and mocked providers (see conftest.py),
        # exactly as every prior session has verified it locally. If a test
        # ever needs a real secret to pass, that test is wrong, not this
        # workflow.
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    # Report-only for now (see docs/decisions/0015) — a free-tier/hobby-scale
    # app shouldn't have a build go red over a transitive advisory with no
    # fix available yet. Promote to blocking once the two suites below have
    # run clean for a while and any existing advisories are triaged.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (backend)
        working-directory: backend
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
